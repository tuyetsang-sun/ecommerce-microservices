syntax = "proto3";

package ecommerce.product;

import "common.proto";

service ProductService {
  rpc ListProducts (ecommerce.common.Empty) returns (ProductListResponse);
  rpc GetProduct (ProductIdRequest) returns (ProductResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (ProductResponse);
  rpc DeleteProduct (ProductIdRequest) returns (ecommerce.common.OperationResponse);
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockResponse);
  rpc ReleaseStock (ReleaseStockRequest) returns (ecommerce.common.OperationResponse);
}

message ProductIdRequest {
  int32 pid = 1;
}

message ProductResponse {
  int32 pid = 1;
  string pname = 2;
  string price = 3;
  int32 quantity = 4;
}

message ProductListResponse {
  repeated ProductResponse items = 1;
}

message CreateProductRequest {
  string pname = 1;
  string price = 2;
  int32 quantity = 3;
}

message UpdateProductRequest {
  int32 pid = 1;
  optional string pname = 2;
  optional string price = 3;
  optional int32 quantity = 4;
}

message StockItem {
  int32 pid = 1;
  int32 qty = 2;
}

message ReserveStockRequest {
  string reservation_id = 1;
  repeated StockItem items = 2;
}

message ReservedItem {
  int32 pid = 1;
  int32 qty = 2;
  string unit_price = 3;
}

message ReserveStockResponse {
  string reservation_id = 1;
  repeated ReservedItem items = 2;
}

message ReleaseStockRequest {
  string reservation_id = 1;
}