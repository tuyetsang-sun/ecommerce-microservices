services:
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:?Missing AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Missing AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME:?Missing AUTH_DB_NAME}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  customer-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CUSTOMER_DB_USER:?Missing CUSTOMER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Missing CUSTOMER_DB_PASSWORD}
      POSTGRES_DB: ${CUSTOMER_DB_NAME:?Missing CUSTOMER_DB_NAME}
    volumes:
      - customer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ORDER_DB_USER:?Missing ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Missing ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME:?Missing ORDER_DB_NAME}
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  product-db:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCT_DB_USER:?Missing PRODUCT_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCT_DB_PASSWORD:?Missing PRODUCT_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${PRODUCT_DB_NAME:?Missing PRODUCT_DB_NAME}
    volumes:
      - product_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  shipment-db:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SHIPMENT_DB_USER:?Missing SHIPMENT_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${SHIPMENT_DB_PASSWORD:?Missing SHIPMENT_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${SHIPMENT_DB_NAME:?Missing SHIPMENT_DB_NAME}
    volumes:
      - shipment_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Missing REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Missing REDIS_PASSWORD}
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GRPC_PORT: "50051"
      PGHOST: auth-db
      PGPORT: "5432"
      PGDATABASE: ${AUTH_DB_NAME:?Missing AUTH_DB_NAME}
      PGUSER: ${AUTH_DB_USER:?Missing AUTH_DB_USER}
      PGPASSWORD: ${AUTH_DB_PASSWORD:?Missing AUTH_DB_PASSWORD}
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.cjs"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s

volumes:
  auth_data:
  customer_data:
  order_data:
  product_data:
  shipment_data:
  redis_data:
  kafka_data:

networks:
  default:
    driver: bridge